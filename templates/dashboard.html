<!DOCTYPE html>
<html>

<head>

    <title>Dashboard</title>

</head>

<body>

    <button>Manage Claims</button>
</a>

<a href="/logout">
    <button>Logout</button>
</a>


<script>

const VAPID_PUBLIC_KEY =
    "BBsi1KXmaTkSoahOvCIduXTsCBG9pMADCCg0I485T_vDaqMX28QsE_goslNt9QauO1ctiSFVIZ3wdBiHxc_UaBo";


if ("serviceWorker" in navigator) {

    navigator.serviceWorker.register(
        "/static/service-worker.js"
    )

    .then(function(registration) {

        console.log(
            "Service Worker registered successfully."
        );

        if ("Notification" in window) {

            return Notification.requestPermission();

        }

    })

    .then(function(permission) {

        if (permission) {

            console.log(
                "Notification permission:",
                permission
            );

        }

        if (
            permission === "granted" ||
            Notification.permission === "granted"
        ) {

            return subscribeToPush();

        }

    })

    .then(function() {

        console.log(
            "Push subscription process completed."
        );

    })

    .catch(function(error) {

        console.error(
            "Push subscription error:",
            error
        );

    });

}


async function subscribeToPush() {

    try {

        console.log("Starting push subscription...");

        const registration =
            await navigator.serviceWorker.ready;

        console.log(
            "Service Worker ready:",
            registration
        );

        let subscription =
            await registration.pushManager.getSubscription();

        console.log(
            "Existing subscription:",
            subscription
        );

        if (!subscription) {

            console.log(
                "Creating new push subscription..."
            );

            subscription =
                await registration.pushManager.subscribe({

                    userVisibleOnly: true,

                    applicationServerKey:
                        urlBase64ToUint8Array(
                            VAPID_PUBLIC_KEY
                        )

                });

            console.log(
                "New subscription created:",
                subscription
            );
        }

        const response =
            await fetch(
                "/save-push-subscription",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(subscription)
                }
            );

        console.log(
            "Backend response status:",
            response.status
        );

        const result =
            await response.json();

        console.log(
            "Push subscription result:",
            result
        );

    } catch (error) {

        console.error(
            "PUSH SUBSCRIPTION ERROR:",
            error
        );

    }
}


function urlBase64ToUint8Array(base64String) {

    const padding =
        "=".repeat(
            (4 - base64String.length % 4) % 4
        );


    const base64 =
        (base64String + padding)
            .replace(/-/g, "+")
            .replace(/_/g, "/");


    const rawData =
        window.atob(base64);


    const outputArray =
        new Uint8Array(
            rawData.length
        );


    for (
        let i = 0;
        i < rawData.length;
        ++i
    ) {

        outputArray[i] =
            rawData.charCodeAt(i);

    }


    return outputArray;

}

</script>

</body>

</html>
